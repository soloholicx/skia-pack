# READ-ONLY verification of a published release.
#
# Releases are cut locally by scripts/release.sh, which packages once, freezes
# the bytes, uploads them to a DRAFT and publishes only after reading every
# asset back. This workflow never builds Skia, never packages and never
# uploads: a rebuild cannot reproduce the released bytes (builds are not
# bit-reproducible), so a CI that rebuilt could only ever disagree with the
# checksum committed at the tag.
#
# It runs when the release is PUBLISHED — i.e. only once all assets are in
# place — and checks, on a clean runner, that the tag, Package.swift, pack.json
# and the downloadable bytes agree, then runs the release gate and the SwiftPM
# consumer check against those bytes. `workflow_dispatch` re-verifies any
# released version on demand.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Released version (tag) to verify, e.g. 150.2.0"
        required: true

permissions:
  contents: read

jobs:
  verify-published:
    runs-on: macos-26 # arm64
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      VERSION: ${{ github.event.release.tag_name || inputs.version }}
      # PINNED. A runner image without them fails here; nothing is substituted.
      SIM_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
      SIM_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.VERSION }}

      - name: Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes | grep -q "$SIM_RUNTIME" \
            || { echo "::error::ENVIRONMENT: pinned runtime $SIM_RUNTIME is not on this image"; exit 1; }

      - name: Boot the pinned simulator
        run: |
          set -euo pipefail
          udid="$(xcrun simctl create skia-pack-verify "$SIM_DEVICE_TYPE" "$SIM_RUNTIME")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SKIA_PACK_SIM_UDID=$udid" >> "$GITHUB_ENV"

      - name: Verify the published assets (downloads only — no build, no upload)
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify_published.sh "$VERSION"

      - name: Keep the verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-published-${{ env.VERSION }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            artifacts/pack.json
            build/verify/*.log
            build/verify-consumer/*.log
